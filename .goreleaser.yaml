version: 2

project_name: datadog-code-security-mcp

before:
  hooks:
    - go mod tidy
    - go mod verify

builds:
  - id: datadog-code-security-mcp
    main: ./cmd/datadog-code-security-mcp
    binary: datadog-code-security-mcp
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # Exclude windows/arm64 (not in the existing build matrix)
    ignore:
      - goos: windows
        goarch: arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.buildTime={{.Date}}
      - -X main.telemetryClientToken={{.Env.TELEMETRY_CLIENT_TOKEN}}
      - -X main.telemetryEnv={{ if .IsSnapshot }}development{{ else }}production{{ end }}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"
    files:
      - none*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

release:
  draft: false
  prerelease: auto
  footer: |
    See the [README](https://github.com/datadog-labs/datadog-code-security-mcp#readme) for installation instructions, prerequisites, and usage examples.

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"
